name: Quality

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:production:check
      - run: npm run content:stats:check
      - run: npm run test:coverage
      - run: npm run doctor
      - run: npm run audit:production
      - run: npm run build:production:smoke
